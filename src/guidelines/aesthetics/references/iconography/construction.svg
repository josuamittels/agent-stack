<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="752" viewBox="0 0 1068 752" role="img" aria-labelledby="title desc"><title id="title">Icon construction relationships</title><desc id="desc">Four illustrative diagrams compare keyshape sizes, aligned stroke edges, butt and round cap endpoints, and geometric versus trial optical centering. Values are teaching examples rather than mandatory family specifications.</desc><rect width="1068" height="752" fill="#f3f6fa"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="26" fill="#202b3d">Icon construction relationships</text><text x="30" y="68" font-size="15" fill="#53637a">Geometry provides repeatable controls. The rendered family determines the final correction.</text><g transform="translate(28 92)"><rect width="492" height="306" rx="12" fill="white" stroke="#d9e0e9"/><text x="22" y="32" font-size="19" fill="#202b3d">1. Keyshapes compare painted extent</text><g transform="translate(45 64) scale(6)"><path d="M0 0V24M0 0H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M1 0V24M0 1H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M2 0V24M0 2H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M3 0V24M0 3H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M4 0V24M0 4H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M5 0V24M0 5H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M6 0V24M0 6H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M7 0V24M0 7H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M8 0V24M0 8H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M9 0V24M0 9H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M10 0V24M0 10H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M11 0V24M0 11H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M12 0V24M0 12H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M13 0V24M0 13H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M14 0V24M0 14H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M15 0V24M0 15H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M16 0V24M0 16H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M17 0V24M0 17H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M18 0V24M0 18H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M19 0V24M0 19H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M20 0V24M0 20H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M21 0V24M0 21H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M22 0V24M0 22H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M23 0V24M0 23H24" stroke="#e1e6ee" stroke-width=".1"/><path d="M24 0V24M0 24H24" stroke="#e1e6ee" stroke-width=".1"/><rect x="3" y="3" width="18" height="18" rx="1" fill="#205ecf" fill-opacity=".12" stroke="#205ecf" stroke-width=".17"/><circle cx="12" cy="12" r="10" fill="none" stroke="#b13d48" stroke-width=".22"/></g><text x="225" y="100" font-size="15" fill="#202b3d">24-unit canvas</text><text x="225" y="128" font-size="15" fill="#205ecf">18-unit square</text><text x="225" y="156" font-size="15" fill="#b13d48">20-unit circle</text><text x="22" y="244" font-size="14" fill="#53637a">Compare at use size, then calibrate the family.</text><text x="22" y="270" font-size="14" fill="#53637a">Illustrative starting shapes, not a universal ratio.</text></g><g transform="translate(548 92)"><rect width="492" height="306" rx="12" fill="white" stroke="#d9e0e9"/><text x="22" y="32" font-size="19" fill="#202b3d">2. Align edges, not every centerline</text><path d="M40 78V188" stroke="#d9e0e9"/><path d="M62 78V188" stroke="#d9e0e9"/><path d="M84 78V188" stroke="#d9e0e9"/><path d="M106 78V188" stroke="#d9e0e9"/><path d="M128 78V188" stroke="#d9e0e9"/><path d="M150 78V188" stroke="#d9e0e9"/><path d="M172 78V188" stroke="#d9e0e9"/><path d="M194 78V188" stroke="#d9e0e9"/><path d="M216 78V188" stroke="#d9e0e9"/><rect x="84" y="85" width="44" height="95" fill="#205ecf" fill-opacity=".22"/><path d="M106 70L106 195" fill="none" stroke="#205ecf" stroke-dasharray="5 4"/><text x="240" y="112" font-size="15" fill="#202b3d">2-unit stroke</text><text x="240" y="140" font-size="15" fill="#202b3d">Center at 6</text><text x="240" y="168" font-size="15" fill="#202b3d">Edges at 5 and 7</text><text x="22" y="229" font-size="14" fill="#53637a">For 1:1 output at 1× with no fractional translation:</text><text x="22" y="257" font-size="14" fill="#53637a">A 1-unit stroke centered at 6.5 has edges at 6 and 7.</text><text x="22" y="282" font-size="14" fill="#53637a">Changing scale or position changes pixel coverage.</text></g><g transform="translate(28 420)"><rect width="492" height="306" rx="12" fill="white" stroke="#d9e0e9"/><text x="22" y="32" font-size="19" fill="#202b3d">3. Equal visible length needs different paths</text><path d="M70 65L70 217" fill="none" stroke="#205ecf" stroke-dasharray="5 4"/><path d="M310 65L310 217" fill="none" stroke="#205ecf" stroke-dasharray="5 4"/><path d="M70 112H310" stroke="#202b3d" stroke-width="20" stroke-linecap="butt"/><circle cx="70" cy="112" r="3" fill="#b13d48"/><circle cx="310" cy="112" r="3" fill="#b13d48"/><path d="M80 183H300" stroke="#202b3d" stroke-width="20" stroke-linecap="round"/><circle cx="80" cy="183" r="3" fill="#b13d48"/><circle cx="300" cy="183" r="3" fill="#b13d48"/><text x="335" y="118" font-size="15" fill="#202b3d">Butt</text><text x="335" y="189" font-size="15" fill="#202b3d">Round</text><text x="22" y="246" font-size="14" fill="#53637a">Red dots mark centerline endpoints.</text><text x="22" y="272" font-size="14" fill="#53637a">Round caps extend half a stroke beyond each endpoint.</text></g><g transform="translate(548 420)"><rect width="492" height="306" rx="12" fill="white" stroke="#d9e0e9"/><text x="22" y="32" font-size="19" fill="#202b3d">4. Center the visible form in its container</text><circle cx="130" cy="143" r="65" fill="#edf2f9" stroke="#d9e0e9"/><circle cx="350" cy="143" r="65" fill="#edf2f9" stroke="#d9e0e9"/><path d="M130 65L130 220" fill="none" stroke="#205ecf" stroke-dasharray="5 4"/><path d="M350 65L350 220" fill="none" stroke="#205ecf" stroke-dasharray="5 4"/><path d="M105 105L155 143L105 181Z" fill="#202b3d"/><path d="M330 105L380 143L330 181Z" fill="#202b3d"/><text x="75" y="239" font-size="14" fill="#202b3d">Bounds centered</text><text x="292" y="239" font-size="14" fill="#202b3d">Shift toward point</text><text x="22" y="276" font-size="14" fill="#53637a">The optical shift is a trial to judge at the intended size.</text></g></g></svg>