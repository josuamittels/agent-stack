<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Grid structures compared</title><desc id="desc">A column grid shows a three-column span beside a one-column region. A modular grid combines fields and leaves some open. A baseline grid coordinates text in two columns. These illustrate different alignment purposes, not prescribed page templates.</desc><rect width="1200" height="620" fill="#f8f7f2"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" font-size="30" fill="#252b30" font-weight="600">Different grids coordinate different relationships</text><text x="36" y="80" font-size="18" fill="#252b30" font-weight="400">A grid is a set of useful alignments. It does not require every field to be filled.</text><text x="36" y="134" font-size="22" fill="#252b30" font-weight="600">01  Column structure</text><rect x="36" y="160" width="350" height="330" fill="#fff" stroke="#999f9e"/><rect x="60" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="138" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="216" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="294" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="60" y="204" width="218" height="82" fill="#b1c2c5" stroke="none"/><rect x="294" y="204" width="62" height="158" fill="#dac697" stroke="none"/><line x1="60" y1="312" x2="272" y2="312" stroke="#52666c"/><line x1="60" y1="332" x2="272" y2="332" stroke="#52666c"/><line x1="60" y1="352" x2="272" y2="352" stroke="#52666c"/><line x1="60" y1="372" x2="272" y2="372" stroke="#52666c"/><line x1="60" y1="392" x2="272" y2="392" stroke="#52666c"/><line x1="60" y1="412" x2="272" y2="412" stroke="#52666c"/><line x1="60" y1="432" x2="272" y2="432" stroke="#52666c"/><text x="68" y="248" font-size="18" fill="#252b30" font-weight="400">3-column span</text><text x="302" y="325" font-size="20" fill="#252b30" font-weight="400">1</text><text x="36" y="530" font-size="17" fill="#252b30" font-weight="400">Columns align edges and control spans.</text><text x="426" y="134" font-size="22" fill="#252b30" font-weight="600">02  Modular structure</text><rect x="426" y="160" width="350" height="330" fill="#fff" stroke="#999f9e"/><rect x="450" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="528" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="606" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="684" y="184" width="62" height="282" fill="#eeeee7" stroke="none"/><rect x="450" y="270" width="296" height="16" fill="#fff" stroke="none"/><rect x="450" y="372" width="296" height="16" fill="#fff" stroke="none"/><rect x="450" y="184" width="140" height="86" fill="#b1c2c5" stroke="none"/><rect x="606" y="286" width="140" height="180" fill="#dac697" stroke="none"/><rect x="450" y="388" width="62" height="78" fill="#b1c2c5" stroke="none"/><text x="458" y="236" font-size="18" fill="#252b30" font-weight="400">2 × 1</text><text x="648" y="380" font-size="18" fill="#252b30" font-weight="400">2 × 2</text><text x="426" y="530" font-size="17" fill="#252b30" font-weight="400">Rows and columns create combinable fields.</text><text x="816" y="134" font-size="22" fill="#252b30" font-weight="600">03  Baseline structure</text><rect x="816" y="160" width="350" height="330" fill="#fff" stroke="#999f9e"/><line x1="840" y1="204" x2="1142" y2="204" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="224" x2="1142" y2="224" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="244" x2="1142" y2="244" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="264" x2="1142" y2="264" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="284" x2="1142" y2="284" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="304" x2="1142" y2="304" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="324" x2="1142" y2="324" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="344" x2="1142" y2="344" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="364" x2="1142" y2="364" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="384" x2="1142" y2="384" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="404" x2="1142" y2="404" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="424" x2="1142" y2="424" stroke="#d8bc7b" stroke-dasharray="4 4"/><line x1="840" y1="444" x2="1142" y2="444" stroke="#d8bc7b" stroke-dasharray="4 4"/><rect x="840" y="194" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="214" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="234" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="254" width="78" height="10" fill="#52666c" stroke="none"/><rect x="840" y="274" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="294" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="314" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="334" width="78" height="10" fill="#52666c" stroke="none"/><rect x="840" y="354" width="118" height="10" fill="#52666c" stroke="none"/><rect x="840" y="374" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="194" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="214" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="234" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="254" width="78" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="274" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="294" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="314" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="334" width="78" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="354" width="118" height="10" fill="#52666c" stroke="none"/><rect x="1004" y="374" width="118" height="10" fill="#52666c" stroke="none"/><text x="816" y="530" font-size="17" fill="#252b30" font-weight="400">Baselines coordinate text across columns.</text><text x="36" y="588" font-size="18" fill="#252b30" font-weight="400">These tools can be combined. Symmetry, proportion, and fixed or fluid behavior are separate choices.</text></g></svg>
