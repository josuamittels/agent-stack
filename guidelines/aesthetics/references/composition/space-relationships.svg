<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Space expresses relationships</title><desc id="desc">Three versions of the same two-field form compare equally repeated intervals, tight label-input pairs separated into groups, and labels detached from fields by excessive local gaps.</desc><rect width="1200" height="650" fill="#f8f7f2"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" font-size="30" fill="#252b30" font-weight="600">Space expresses relationships</text><text x="36" y="80" font-size="18" fill="#252b30" font-weight="400">The same content can form different groups. Compare the gaps, not just the empty area.</text><text x="36" y="130" font-size="22" fill="#252b30" font-weight="600">01  Equal intervals</text><rect x="36" y="155" width="350" height="390" fill="#fff" stroke="#d4d3cc"/><text x="60" y="195" font-size="19" fill="#252b30" font-weight="400">Name</text><rect x="60" y="225" width="302" height="42" fill="#f0f1ed" stroke="#8d969b"/><text x="72" y="252" font-size="16" fill="#626c73" font-weight="400">Enter name</text><text x="60" y="315" font-size="19" fill="#252b30" font-weight="400">Email</text><rect x="60" y="345" width="302" height="42" fill="#f0f1ed" stroke="#8d969b"/><text x="72" y="372" font-size="16" fill="#626c73" font-weight="400">Enter email</text><text x="36" y="580" font-size="16" fill="#252b30" font-weight="400">The label-to-field relationship is weak.</text><text x="426" y="130" font-size="22" fill="#252b30" font-weight="600">02  Clear local groups</text><rect x="426" y="155" width="350" height="390" fill="#fff" stroke="#d4d3cc"/><text x="450" y="190" font-size="19" fill="#252b30" font-weight="400">Name</text><rect x="450" y="206" width="302" height="42" fill="#f0f1ed" stroke="#8d969b"/><text x="462" y="233" font-size="16" fill="#626c73" font-weight="400">Enter name</text><text x="450" y="324" font-size="19" fill="#252b30" font-weight="400">Email</text><rect x="450" y="340" width="302" height="42" fill="#f0f1ed" stroke="#8d969b"/><text x="462" y="367" font-size="16" fill="#626c73" font-weight="400">Enter email</text><text x="426" y="580" font-size="16" fill="#252b30" font-weight="400">Near within a pair; farther between pairs.</text><text x="816" y="130" font-size="22" fill="#252b30" font-weight="600">03  Detached pairs</text><rect x="816" y="155" width="350" height="390" fill="#fff" stroke="#d4d3cc"/><text x="840" y="190" font-size="19" fill="#252b30" font-weight="400">Name</text><rect x="840" y="275" width="302" height="42" fill="#f0f1ed" stroke="#8d969b"/><text x="852" y="302" font-size="16" fill="#626c73" font-weight="400">Enter name</text><text x="840" y="390" font-size="19" fill="#252b30" font-weight="400">Email</text><rect x="840" y="475" width="302" height="42" fill="#f0f1ed" stroke="#8d969b"/><text x="852" y="502" font-size="16" fill="#626c73" font-weight="400">Enter email</text><text x="816" y="580" font-size="16" fill="#252b30" font-weight="400">Large local gaps separate labels from fields.</text><text x="36" y="624" font-size="17" fill="#252b30" font-weight="400">Illustrative geometry. Readability, target size, and actual content still determine usable distances.</text></g></svg>
